name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Visible app version, for example 1.2.0
        required: true
        type: string
      version_code:
        description: Monotonic integer versionCode, for example 12
        required: true
        type: string

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build-release-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read

    env:
      RELEASE_KEYSTORE_FILE: release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_FILE"

      - name: Build signed release bundle
        run: |
          ./gradlew :app:bundleRelease \
            -PciVersionCode=${{ github.event.inputs.version_code }} \
            -PciVersionName=${{ github.event.inputs.version_name }}

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.event.inputs.version_name }}-${{ github.event.inputs.version_code }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
